name: Deploy to Airflow server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to Airflow dags path
        env:
          AIRFLOW_DEPLOY_PATH: ${{ secrets.AIRFLOW_DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.idea/' \
            --exclude '.github/' \
            --exclude '*.sas7bdat' \
            --exclude '.env' \
            --exclude '**/.env' \
            ./ "${AIRFLOW_DEPLOY_PATH}/"

      # --- OPTIONAL: Airflow neu starten, damit der DAG sofort neu geparst wird ---
      # Auskommentiert, da unbekannt ist, wie Airflow auf dem Server läuft
      # (systemd, docker-compose, managed). In der Regel NICHT nötig: der
      # Scheduler pollt den dags_folder ohnehin (dag_dir_list_interval, Default 5min).
      #
      # - name: Restart Airflow (systemd)
      #   run: sudo systemctl restart airflow-scheduler airflow-webserver
